<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <!-- viewport-fit=cover keeps the layout correct inside notched-device
       browsers; user-scalable is left on so the page stays accessible. -->
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <meta name="google-adsense-account" content="ca-pub-9551858594597671">
  <meta name="description"
    content="Oralidle — Coaching for spoken English fluency, real-time speech analysis, and technical mock interviews.">
  <meta name="theme-color" content="#131313">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="Oralidle">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Oralidle — Speech & Interview Coach</title>
  <link rel="manifest" href="manifest.json">

  <!-- Queue stub must exist before any va() call; vercel-analytics.js loads
       the script itself at the end of <body>. -->
  <script>
    window.va = window.va || function () { (window.vaq = window.vaq || []).push(arguments); };
  </script>

  <!-- Google AdSense -->
  <script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-9551858594597671"
       crossorigin="anonymous"></script>
</head>
<body>
  <style>
    html, body {
      margin: 0;
      padding: 0;
      width: 100%;
      height: 100%;
      background-color: #16110F;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      overflow: hidden;
    }

    .loading-wrapper {
      position: fixed;
      inset: 0;
      display: flex;
      align-items: center;
      justify-content: center;
      background-color: #16110F;
      z-index: 99999;
      transition: opacity 0.5s ease-out, transform 0.5s ease-out;
      user-select: none;
    }

    .loading-wrapper.loaded {
      opacity: 0;
      transform: scale(0.98);
      pointer-events: none;
    }

    .loading-container {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 32px 24px;
      max-width: 360px;
      text-align: center;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      margin-bottom: 26px;
    }

    .logo-box {
      width: 54px;
      height: 54px;
      border-radius: 16px;
      background: #221A17;
      border: 1px solid #3A2D28;
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 14px;
      box-shadow: 0 4px 20px rgba(0, 0, 0, 0.45);
    }

    .brand-icon {
      width: 32px;
      height: 32px;
      object-fit: contain;
    }

    .brand-title {
      color: #F5EFEA;
      font-size: 24px;
      font-weight: 800;
      letter-spacing: -0.4px;
      margin-bottom: 4px;
    }

    .brand-tagline {
      color: #B0A099;
      font-size: 13px;
      font-weight: 500;
      letter-spacing: 0.2px;
    }

    .waveform-container {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
      height: 72px;
      padding: 0 12px;
      margin-bottom: 24px;
    }

    .waveform-container .bar {
      width: 4px;
      height: var(--h, 30px);
      background-color: var(--c, #FF8A5B);
      border-radius: 3px;
      animation: wave 1.2s ease-in-out infinite alternate;
      animation-delay: calc(var(--i) * 0.06s);
      box-shadow: 0 0 10px rgba(255, 138, 91, 0.15);
      transform-origin: center;
    }

    @keyframes wave {
      0% {
        transform: scaleY(0.2);
        opacity: 0.35;
      }
      50% {
        transform: scaleY(0.65);
        opacity: 0.75;
      }
      100% {
        transform: scaleY(1);
        opacity: 1;
      }
    }

    .loading-status {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-pulse {
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background-color: #5FD9A4;
      box-shadow: 0 0 8px #5FD9A4;
      animation: pulse 1.6s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% {
        opacity: 0.4;
        transform: scale(0.85);
      }
      50% {
        opacity: 1;
        transform: scale(1.2);
      }
    }

    .status-text {
      color: #9C8B82;
      font-size: 12px;
      font-weight: 500;
      letter-spacing: 0.3px;
    }
  </style>

  <div id="loading" class="loading-wrapper">
    <div class="loading-container">
      <div class="brand-header">
        <div class="logo-box">
          <img src="favicon.png" alt="Oralidle" class="brand-icon" />
        </div>
        <div class="brand-title">Oralidle</div>
        <div class="brand-tagline">Speech &amp; Interview Coach</div>
      </div>

      <div class="waveform-container">
        <span class="bar" style="--i: 1; --h: 22px; --c: #58C7D4;"></span>
        <span class="bar" style="--i: 2; --h: 36px; --c: #58C7D4;"></span>
        <span class="bar" style="--i: 3; --h: 20px; --c: #58C7D4;"></span>
        <span class="bar" style="--i: 4; --h: 44px; --c: #5FD9A4;"></span>
        <span class="bar" style="--i: 5; --h: 28px; --c: #5FD9A4;"></span>
        <span class="bar" style="--i: 6; --h: 56px; --c: #5FD9A4;"></span>
        <span class="bar" style="--i: 7; --h: 38px; --c: #FF8A5B;"></span>
        <span class="bar" style="--i: 8; --h: 64px; --c: #FF8A5B;"></span>
        <span class="bar" style="--i: 9; --h: 48px; --c: #FFB392;"></span>
        <span class="bar" style="--i: 10; --h: 68px; --c: #FF8A5B;"></span>
        <span class="bar" style="--i: 11; --h: 60px; --c: #FF8A5B;"></span>
        <span class="bar" style="--i: 12; --h: 42px; --c: #FFB392;"></span>
        <span class="bar" style="--i: 13; --h: 62px; --c: #5FD9A4;"></span>
        <span class="bar" style="--i: 14; --h: 32px; --c: #5FD9A4;"></span>
        <span class="bar" style="--i: 15; --h: 52px; --c: #5FD9A4;"></span>
        <span class="bar" style="--i: 16; --h: 26px; --c: #58C7D4;"></span>
        <span class="bar" style="--i: 17; --h: 40px; --c: #58C7D4;"></span>
        <span class="bar" style="--i: 18; --h: 22px; --c: #58C7D4;"></span>
        <span class="bar" style="--i: 19; --h: 34px; --c: #856F66;"></span>
        <span class="bar" style="--i: 20; --h: 18px; --c: #856F66;"></span>
      </div>

      <div class="loading-status">
        <span class="status-pulse"></span>
        <span class="status-text">Loading speech coach…</span>
      </div>
    </div>
  </div>

  <script>
    function hideLoader() {
      var loader = document.getElementById('loading');
      if (loader && !loader.classList.contains('loaded')) {
        loader.classList.add('loaded');
        setTimeout(function () {
          if (loader.parentNode) loader.parentNode.removeChild(loader);
        }, 550);
      }
    }

    window.addEventListener('flutter-first-frame', hideLoader);

    var observer = new MutationObserver(function (mutations) {
      for (var i = 0; i < mutations.length; i++) {
        var added = mutations[i].addedNodes;
        for (var j = 0; j < added.length; j++) {
          var tag = added[j].tagName;
          if (tag === 'FLT-GLASS-PANE' || tag === 'FLUTTER-VIEW' || tag === 'CANVAS') {
            hideLoader();
            observer.disconnect();
            return;
          }
        }
      }
    });
    observer.observe(document.body, { childList: true, subtree: true });
  </script>

  <!--
    You can customize the "flutter_bootstrap.js" script.
    This is useful to provide a custom configuration to the Flutter loader
    or to give the user feedback during the initialization process.

    For more details:
    * https://docs.flutter.dev/platform-integration/web/initialization
  -->
  <script src="flutter_bootstrap.js" async></script>
  
  <!-- Vercel Web Analytics -->
  <script src="vercel-analytics.js" defer></script>

  <!-- Vercel Speed Insights -->
  <script src="vercel-speed-insights.js" defer></script>
</body>
</html>
