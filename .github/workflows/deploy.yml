name: Test & Deploy

# Production comes from `main`; opening a PR into `main` (typically from
# `develop`) gets a preview URL to check before merging.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read
  pull-requests: write

concurrency:
  # A newer push supersedes an in-flight run for the same ref. Production is
  # exempt so a queued release is never cancelled halfway.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  FLUTTER_VERSION: 3.44.1

jobs:
  deploy:
    name: ${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Dart dependencies
        run: flutter pub get

      # `.env` is a declared Flutter asset, so the build fails outright if the
      # file is missing. The example is empty by design — the Gemini key lives
      # on the server behind api/gemini.js, never in the bundle.
      - name: Create empty .env
        run: cp .env.example .env

      # The gate. Nothing deploys unless the suite is green.
      - name: Run tests
        run: flutter test

      - name: Install Vercel CLI
        run: npm install --global vercel@48

      - name: Pull Vercel environment
        run: >-
          vercel pull --yes
          --environment=${{ github.ref == 'refs/heads/main' && 'production' || 'preview' }}
          --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Flutter lives on this runner, so the web build happens here and Vercel
      # only receives the finished output — it never needs a Flutter toolchain.
      - name: Build
        run: |
          set -euo pipefail
          envfile=$(ls .vercel/.env.*.local 2>/dev/null | head -1 || true)
          if [ -z "$envfile" ]; then
            echo "::error::vercel pull produced no env file — nothing to build with."
            exit 1
          fi
          echo "Sourcing $envfile"
          set -a
          # shellcheck disable=SC1090
          . "$envfile"
          set +a
          vercel build \
            ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }}
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Assert the build carries its configuration
        run: |
          set -euo pipefail
          envfile=$(ls .vercel/.env.*.local 2>/dev/null | head -1 || true)
          [ -n "$envfile" ] || { echo "::error::No pulled env file to check against."; exit 1; }
          set -a
          # shellcheck disable=SC1090
          . "$envfile"
          set +a

          bundle=.vercel/output/static/main.dart.js

          # Checks that each configured value is literally in the bundle, rather
          # than matching a pattern. Patterns match the app's own source: the
          # hCaptcha *test* sitekey is a `const` in HCaptchaConfig and so is
          # compiled in whether or not it is the one in use, and
          # supabase_flutter compiles the `sb_publishable_` prefix in for its
          # own key-type check. Both would pass a pattern test on a bundle with
          # no configuration at all.
          target=${{ github.ref == 'refs/heads/main' && 'Production' || 'Preview' }}

          missing=0
          for var in SUPABASE_URL SUPABASE_PUBLISHABLE_KEY HCAPTCHA_SITE_KEY; do
            value="${!var:-}"
            if [ -n "$value" ]; then
              grep -qF "$value" "$bundle" \
                || { echo "::error::$var is set but did not reach the bundle — check the --dart-define in vercel.json."; exit 1; }
              echo "$var reached the bundle."
              continue
            fi

            missing=1
            # A Sensitive variable comes back named but valueless, which is
            # indistinguishable from unset unless you look for the name.
            if grep -qE "^${var}=" "$envfile"; then
              echo "::error::$var is marked Sensitive on Vercel, so vercel pull returns it empty. These three are compiled into the public bundle anyway — unmark Sensitive for $target."
            else
              echo "::error::$var is not set for the $target environment on the Vercel project."
            fi
          done

          if [ $missing -eq 1 ]; then
            echo
            echo "Vercel > Settings > Environment Variables, or:"
            echo "  vercel env rm <NAME> && vercel env add <NAME>   # leave Sensitive unticked"
            echo
            echo "GEMINI_API_KEY and ALLOWED_ORIGIN should stay Sensitive — they are"
            echo "read at runtime by api/gemini.js, where Sensitive works fine. Only"
            echo "build-time values are affected."
            exit 1
          fi

      # A bundled key would defeat the whole proxy. Cheap to check, and the
      # failure mode is silent otherwise.
      - name: Assert the build produced a real bundle with no secrets
        run: |
          set -euo pipefail
          # Without this the grep below passes vacuously on an empty directory.
          test -f .vercel/output/static/index.html \
            || { echo "::error::Build output is missing index.html."; exit 1; }
          test -f .vercel/output/static/main.dart.js \
            || { echo "::error::Build output is missing main.dart.js."; exit 1; }

          # The Supabase publishable key is expected in the bundle — it is
          # public by design and RLS is what protects the data. sb_secret_ is
          # the one that must never get near a --dart-define.
          #
          # Key material is required after the prefix, not just the prefix:
          # supabase_flutter compiles `startsWith("sb_secret_")` into the bundle
          # for its own key-type check, so matching the bare prefix fails every
          # build on the library's own source.
          if grep -rlE '(AIza[0-9A-Za-z_-]{20,}|sk-ant-|sb_secret_[A-Za-z0-9_-]{10,})' .vercel/output/static; then
            echo "::error::An API key is present in the web bundle. Refusing to deploy."
            exit 1
          fi
          echo "Build output looks complete and carries no API keys."

      - name: Deploy
        id: deploy
        run: |
          set -euo pipefail
          url="$(vercel deploy --prebuilt \
            ${{ github.ref == 'refs/heads/main' && '--prod' || '' }} \
            --token=${{ secrets.VERCEL_TOKEN }} | tail -1)"
          echo "Deployed to $url"
          echo "url=$url" >> "$GITHUB_OUTPUT"
        env:
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Comment preview URL
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const url = '${{ steps.deploy.outputs.url }}';
            const marker = '<!-- vercel-preview -->';
            const body = `${marker}\n**Preview deployed:** ${url}`;

            const { data: comments } = await github.rest.issues.listComments({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
            });
            // Update in place so a busy PR does not collect one comment per push.
            const existing = comments.find((c) => c.body.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                comment_id: existing.id,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                issue_number: context.issue.number,
                owner: context.repo.owner,
                repo: context.repo.repo,
                body,
              });
            }
