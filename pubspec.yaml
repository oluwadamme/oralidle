name: widget_overlay_outside
description: "Speech Fluency Coach - improve oral English communication skills."
publish_to: 'none'

version: 1.0.0+1

environment:
  # 3.12 is the floor for flutter_gemma_litertlm (native assets build hook).
  sdk: ">=3.12.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_web_plugins:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^2.6.1

  # Charts
  fl_chart: ^0.70.2

  # Navigation
  go_router: ^14.8.1

  # HTTP for Claude API
  http: ^1.2.2

  # Local storage (community edition)
  hive_ce: ^2.9.0
  hive_ce_flutter: ^2.2.0

  # Permissions
  permission_handler: ^11.4.0

  # Env config
  flutter_dotenv: ^5.2.1

  # File picker for audio upload
  file_picker: ^8.1.6

  # Google Fonts (Plus Jakarta Sans, Manrope, Space Grotesk)
  google_fonts: ^6.2.1

  # Microphone capture. The single owner of the mic app-wide — see
  # core/services/speech/audio_capture_service.dart.
  record: ^6.2.0
  audioplayers: ^6.7.1
  path_provider: ^2.1.5

  # On-device speech-to-text (Moonshine via LiteRT). Primary transcription
  # engine on native platforms; web falls back to server-side transcription.
  flutter_gemma: ^1.5.9
  flutter_gemma_speech: ^0.4.3

  # Utilities
  intl: ^0.20.2
  uuid: ^4.5.1
  lucide_icons_flutter: ^3.1.15

  # Google Mobile Ads & Web AdSense
  google_mobile_ads: ^5.2.0
  web: ^1.1.0
  supabase_flutter: ^2.17.2
  connectivity_plus: ^7.3.1
  webview_flutter: ^4.14.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/cv.md
    - assets/interview-prep-skills.md
    - assets/logo_variant_1.png
    - assets/logo_variant_3.png
